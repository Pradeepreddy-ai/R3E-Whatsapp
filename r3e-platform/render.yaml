# ═══════════════════════════════════════════════════
#  render.yaml — Render deployment configuration
#  Commit this file so Render auto-configures the service
# ═══════════════════════════════════════════════════
services:
  - type: web
    name: r3e-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: r3e-postgres
          property: connectionString

databases:
  - name: r3e-postgres
    plan: free
    databaseName: r3e
    user: r3e_user
